# The same configuration as frpc.toml, in the legacy ini format.
# The format is detected from the content: a [common] section makes it ini.

[common]
server_addr = 127.0.0.1
# The frps ssh tunnel gateway port (sshTunnelGateway.bindPort), not bindPort.
server_port = 2200
authentication_method = token
token = 12345678

[test-tcp]
type = tcp
local_ip = 127.0.0.1
local_port = 22
remote_port = 6000
