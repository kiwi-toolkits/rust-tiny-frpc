# The ini twin of frpc_full_example.toml. It keeps the same items, expressed
# with the legacy key names frp used before the toml format.
#
# A file is treated as ini when it parses into sections and one of them is
# [common]; the extension does not matter.

# [common] is the integral section.
[common]
# frps builds the wire-level proxy name as "{user}.{proxy}" itself.
user = your_name

# A literal IPv6 address must be enclosed in square brackets when a port is
# attached, as in "[::1]:80".
server_addr = 0.0.0.0

# This must be the frps *ssh tunnel gateway* port
# (sshTunnelGateway.bindPort), NOT the native protocol port (bindPort).
server_port = 2200

# authentication_method is always "token"; frps accepts nothing else here.
authentication_method = token
token = 12345678

# Retry a duplicate proxy under a deterministic ex_N_ name. Off by default.
# rename = true

# Send the per-proxy meta_* keys to frps. Off by default: --metadatas needs
# frps >= 0.61.2.
# metadatas_enabled = true

# Also prefix the proxy name with "{user}." on the client side, reproducing
# the pre-1.0 "your_name.your_name.ssh" names. Off by default.
# user_double_prefix = false

# Private key for the ssh tunnel gateway. Default $HOME/.ssh/id_rsa.
# ssh_private_key = /home/user/.ssh/id_rsa

# Verify the gateway host key. Off by default.
# ssh_known_hosts = /home/user/.ssh/known_hosts

# Upper bound on concurrently bridged forwarded connections.
# max_forward_connections = 512

# 'ssh' is the unique proxy name.
[ssh]
type = tcp
local_ip = 127.0.0.1
local_port = 22
# Remote port listened on by frps.
remote_port = 6001

# Resolve your domain names to [server_addr] so you can use
# http://web01.yourdomain.com to browse web01.
[web01]
type = http
local_ip = 127.0.0.1
local_port = 80
# HTTP basic auth for this proxy.
http_user = admin
http_pwd = admin
# With a frps subdomain host of frps.com this answers on web01.frps.com.
subdomain = web01
custom_domains = web01.yourdomain.com
# locations is only available for http type.
locations = /,/pic
host_header_rewrite = example.com
# Additional meta info for each proxy, passed to a server-side plugin.
# Requires metadatas_enabled = true, and frps >= 0.61.2.
# meta_var1 = abc
# meta_var2 = 123

[web02]
type = https
local_ip = 127.0.0.1
local_port = 8000
subdomain = web02
custom_domains = web02.yourdomain.com

[tcpmuxhttpconnect]
type = tcpmux
multiplexer = httpconnect
local_ip = 127.0.0.1
local_port = 10701
custom_domains = tunnel1

[secret_tcp]
# With stcp, remote_port is unused.
type = stcp
# sk authenticates visitors.
sk = abcdefg
local_ip = 127.0.0.1
local_port = 22
# If not empty, only visitors from the listed users may connect; '*' means all.
allow_users = *

# Visitors have no ini syntax; use toml if you need them. A section with
# role = visitor is rejected with an explicit error rather than ignored.
