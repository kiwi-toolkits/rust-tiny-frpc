name: Release

# Dispatched by the release script rather than triggered by a tag push, so the
# tagged commit is guaranteed to be the one that was checked locally.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach the artifacts to"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: linux-x86_64
          - target: aarch64-unknown-linux-musl
            name: linux-aarch64
          - target: armv7-unknown-linux-musleabihf
            name: linux-armv7
          - target: x86_64-apple-darwin
            name: darwin-x86_64
          - target: aarch64-apple-darwin
            name: darwin-aarch64
          - target: x86_64-pc-windows-msvc
            name: windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          # Prefer the dispatched tag; fall back to the ref for a manual run.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # zig supplies the C toolchain aws-lc-sys needs when cross-compiling to
      # musl targets that have no system compiler here.
      - name: Install zig
        if: contains(matrix.target, 'musl')
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: contains(matrix.target, 'musl')
        run: cargo install cargo-zigbuild --locked

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == *musl* ]]; then
            # Fat LTO over an ARM/aarch64 link can take an unbounded amount of
            # time; correctness of the artifact matters more here than the last
            # few hundred kilobytes.
            export CARGO_PROFILE_RELEASE_LTO=off
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
            cargo zigbuild --release --target "${{ matrix.target }}" \
              --bin tiny-frpc --bin tiny-frpc-ssh
          else
            cargo build --release --target "${{ matrix.target }}" \
              --bin tiny-frpc --bin tiny-frpc-ssh
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag }}"
          version="${tag#v}"
          suffix=""
          [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ] && suffix=".exe"
          out="rust-tiny-frpc_${version}_${{ matrix.name }}"
          mkdir -p "dist/$out"
          cp "target/${{ matrix.target }}/release/tiny-frpc$suffix" "dist/$out/"
          cp "target/${{ matrix.target }}/release/tiny-frpc-ssh$suffix" "dist/$out/"
          cp README.md README_zh.md LICENSE CHANGELOG.md "dist/$out/"
          cp -r conf "dist/$out/"
          (cd dist && tar czf "$out.tar.gz" "$out")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Only for CHANGELOG.md, which becomes the release body.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          body_path: CHANGELOG.md
          files: dist/*.tar.gz
